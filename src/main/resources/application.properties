spring.application.name=pagoflex-backend

server.port=8080

# Configuración Base de Datos H2 activa
spring.datasource.url=jdbc:h2:mem:pagoflexdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2 (útil para mostrar la BD en la defensa)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logs detallados de peticiones HTTP (GET, POST, PUT, DELETE) y SQL
logging.level.org.springframework.web=DEBUG
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE
